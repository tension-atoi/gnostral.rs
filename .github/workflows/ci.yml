name: repository-hygiene

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Public artifact hygiene
        run: ./scripts/check-public.sh
      - name: Whitespace
        run: git diff --check
