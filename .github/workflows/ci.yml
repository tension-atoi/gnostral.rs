name: public-research-sanity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Public artifact checks
        run: ./scripts/check-public.sh
      - name: Whitespace
        run: git diff --check HEAD^ HEAD || git diff --check
